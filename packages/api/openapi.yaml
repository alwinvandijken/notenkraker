openapi: 3.1.0
info:
  title: Notenkraker API
  version: 0.1.0
  description: |
    Contract tussen frontends en de headless backend. Leesacties lopen via
    PostgREST (Supabase) met Row Level Security; commando's met logica via
    Edge Functions. `@notenkraker/client` is de referentie-implementatie.
servers:
  - url: https://{project}.supabase.co/functions/v1
    variables: { project: { default: "notenkraker" } }
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    NoteId:
      type: string
      description: Nederlandse nootnaam + octaaf van de geschreven toon, bv. g4, fis4, bes3
      pattern: "^[a-g](is|es|s)?-?\\d$"
    NoteStatus: { type: string, enum: [kent, les, moet] }
    Answer:
      type: object
      required: [expected, given, correct]
      properties:
        expected: { $ref: "#/components/schemas/NoteId" }
        given: { oneOf: [{ $ref: "#/components/schemas/NoteId" }, { type: "null" }] }
        correct: { type: boolean }
    RoundSubmission:
      type: object
      required: [studentId, mode, ms, answers]
      properties:
        studentId: { type: string, format: uuid }
        mode: { type: string, enum: [buttons, mic] }
        ms: { type: integer }
        answers: { type: array, items: { $ref: "#/components/schemas/Answer" } }
    Round:
      allOf:
        - $ref: "#/components/schemas/RoundSubmission"
        - type: object
          required: [id, playedAt, completed, mistakes, stars, xp, wrongNotes]
          properties:
            id: { type: string, format: uuid }
            playedAt: { type: string, format: date-time }
            completed: { type: boolean }
            mistakes: { type: integer }
            stars: { type: integer, minimum: 0, maximum: 3 }
            xp: { type: integer }
            wrongNotes: { type: array, items: { $ref: "#/components/schemas/NoteId" } }
    Student:
      type: object
      required: [id, name, instrumentId, naming]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        instrumentId: { type: string }
        naming: { type: string, enum: [nl, en] }
        userId: { type: [string, "null"], format: uuid }
        ageBand: { type: [string, "null"], enum: ["6-8", "9-12", "13-17", "18+", null] }
        experience: { type: [string, "null"], enum: [nieuw, lt1, "1-3", gt3, null] }
        onboardedAt: { type: [string, "null"], format: date-time }
paths:
  /rounds:
    post:
      summary: Ronde inleveren; server berekent sterren en XP
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RoundSubmission" } } } }
      responses:
        "200": { description: Opgeslagen ronde, content: { application/json: { schema: { type: object, properties: { round: { $ref: "#/components/schemas/Round" } } } } } }
        "403": { description: Geen toegang tot deze leerling }
  /invite-code:
    post:
      summary: Uitnodigingscode voor een leerling. 'leraar' koppelt een leraar; 'kind' laat het kind zelf inloggen (alleen de eigenaar/ouder)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [studentId], properties: { studentId: { type: string, format: uuid }, purpose: { type: string, enum: [leraar, kind], default: leraar } } } } } }
      responses:
        "200": { description: Code (7 dagen geldig), content: { application/json: { schema: { type: object, properties: { code: { type: string } } } } } }
        "403": { description: Geen toegang tot deze leerling }
  /link-student:
    post:
      summary: Leraar koppelt zichzelf aan een leerling via code
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string } } } } } }
      responses:
        "200": { description: Gekoppelde leerling, content: { application/json: { schema: { type: object, properties: { student: { $ref: "#/components/schemas/Student" } } } } } }
        "404": { description: Code onbekend of verlopen }
x-rpc:
  description: |
    Postgres-functies via PostgREST (POST /rest/v1/rpc/<naam>), zie supabase/migrations/0002_rollen.sql.
    choose_role(p_role: 'leerling'|'ouder') — eenmalig na de eerste Google-login; bij leerling ook een eigen leerlingprofiel.
    claim_student(p_code) → Student — kind koppelt zijn eigen login aan het leerlingprofiel van de ouder (code met purpose 'kind').
    create_invite_code(p_student_id, p_purpose) → code — door /invite-code gebruikt.
    practice_start(p_student) → PracticeSession — vrij oefenen starten; de server zet started_at (0003_oefensessies.sql).
    practice_update(p_id, p_minutes, p_notes, p_done) → PracticeSession — elke 30 s en bij Klaar. p_minutes is
      [{ s: 0..60, notes: [NoteId] }] per minuut sinds de start. De server zet ended_at, weigert meer minuten dan er
      verstreken zijn, kapt de gespeelde tijd af op de verstreken tijd (max 3 uur) en geeft het label sax|twijfel.
    give_homework(p_student, p_notes, p_minutes, p_days, p_piece, p_piece_note, p_remark, p_due) → Homework — alleen
      de ouder (eigenaar) of een gekoppelde leraar (0005_huiswerk.sql). Zet de noten op 'les' (behalve 'kent'). Per gever
      telt het nieuwste huiswerk; huiswerk van een ander blijft staan en is niet te wijzigen.
    give_feedback(p_kind, p_message, p_screen, p_url, p_device, p_version) — alleen als profiles.can_give_feedback (0006_feedback.sql).
    set_feedback_allowed(p_user, p_allowed), admin_users() → [{id, display_name, email, role, can_give_feedback}] — alleen admin.
  roles: |
    profiles.role: null (nog kiezen) | leerling | ouder | leraar | admin.
    leerling en ouder kiest de gebruiker zelf; leraar en admin worden in Supabase toegewezen. admin leest alles.
x-postgrest:
  description: |
    Tabellen die rechtstreeks via PostgREST (met RLS) gelezen/geschreven worden:
    students (select/insert/update/delete), student_notes (select/upsert/delete),
    rounds (select), practice_sessions (select), homework (select), feedback (select/update status, alleen admin), songs (select/insert/delete), attempts (select/insert).
    Instrumentdefinities zijn geen API-data maar versiebeheerde content
    (packages/instruments); een niet-TypeScript frontend leest de JSON-bestanden
    uit de repo of een gepubliceerde kopie.
