<!doctype html>
<html lang="nl">
<head>

<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&amp;display=swap" rel="stylesheet">

<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #EDF2F7; color: #172440; font-family: Lexend, sans-serif; display: flex; flex-direction: column">

        <span style="font-size: 15px; color: #C9D3E6">8 noten · 3 levens</span>
      </div>
      <span style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 56px; border-radius: 28px; background: #F4A261; color: #172440; font-size: 20px; font-weight: 700">

        Speel

    <a href="Phone-Spel.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; color: #4A5873; text-decoration: none; font-size: 12px; font-weight: 500">

    <a href="Phone-Grepen.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; color: #4A5873; text-decoration: none; font-size: 12px; font-weight: 500">

    <a href="Phone-Leraar.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; color: #4A5873; text-decoration: none; font-size: 12px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4" stroke="#4A5873" stroke-width="2" fill="none"></circle><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6" stroke="#4A5873" stroke-width="2" fill="none" stroke-linecap="round"></path></svg>Leraar</a>
