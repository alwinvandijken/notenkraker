<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D-grepen iPhone B</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="sax3d/ui.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<style>

.stage { position: fixed; inset: 0; border-radius: 0; }
.float-top { position: fixed; top: calc(14px + env(safe-area-inset-top)); left: 14px; right: 14px; display: flex; align-items: flex-start; gap: 10px; z-index: 3; }
.note-pill { margin-left: auto; background: var(--surface); border-radius: 20px; padding: 6px 12px 6px 6px; display: flex; align-items: center; gap: 4px; box-shadow: 0 2px 8px rgba(23,36,64,.15); }
.note-pill .staff-svg { width: 96px; height: 76px; }
.note-pill .big-name { font-size: 46px; }
.note-pill .badge { font-size: 11px; padding: 2px 7px; display: block; margin-top: 4px; }
.back { box-shadow: 0 2px 8px rgba(23,36,64,.15); }
.saxbar.r { top: calc(120px + env(safe-area-inset-top)); right: 14px; flex-direction: column; position: fixed; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-radius: 26px 26px 0 0; padding: 10px 16px calc(14px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; z-index: 3; box-shadow: 0 -4px 16px rgba(23,36,64,.08); }
.grip { width: 40px; height: 5px; border-radius: 3px; background: var(--line); align-self: center; }
.sheet-row { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
.dashed { min-height: 36px; font-size: 13px; flex: none; }
.druk { font-size: 15px; }
.note-btn { flex: 0 0 54px; min-height: 56px; font-size: 20px; }
.seg { background: var(--bg); }
.seg button { min-height: 32px; font-size: 13px; padding: 0 12px; }
.toast { bottom: 230px; position: fixed; }

</style>
</head>
<body>
<div class="stage" data-stage>
  <div class="toast" data-info hidden></div>
</div>
<div class="float-top">
  <button class="back" aria-label="Terug"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <div class="note-pill" aria-label="Noot">
    <div class="staff-svg" data-note-staff="small"></div>
    <div><div class="big-name" data-note-name></div><span class="badge" data-status></span></div>
  </div>
</div>
<div class="saxbar r"><button class="icon" data-play aria-label="Laat horen"><svg width="20" height="20" viewBox="0 0 22 22" aria-hidden="true"><path d="M3 8h4l5-4v14l-5-4H3z" fill="currentColor"/><path d="M15 7.5a5 5 0 010 7M17.5 5a8.5 8.5 0 010 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg></button>
        <button class="icon" data-view-cycle aria-label="Andere kant"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 11-3-6.7"/><path d="M21 4v5h-5"/></svg></button>
        <button class="icon" data-zoom="in" aria-label="Inzoomen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
        <button class="icon" data-zoom="out" aria-label="Uitzoomen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
        <button class="icon" data-explode aria-pressed="false" aria-label="Uit elkaar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v6M9 6l3-3 3 3M12 21v-6M9 18l3 3 3-3"/><rect x="7" y="10.5" width="10" height="3" rx="1.5"/></svg></button>
      </div>
<section class="sheet" aria-label="Greep en noten">
  <div class="grip"></div>
  <div class="sheet-row"><p class="druk" data-druk></p><button class="dashed" data-showall aria-pressed="false">Toon alle kleppen</button></div>
  <div class="alts" data-alts></div>
  <div class="sheet-row"><div class="seg" role="group" aria-label="Welke noten"><button data-filter="mine">Mijn noten</button><button data-filter="all">Alle noten</button></div></div>
  <nav aria-label="Kies een noot"><div class="strip" data-notes></div></nav>
</section>
<script type="module">
import { mountGrepen } from "./sax3d/ui.js";
mountGrepen({ sax: { dist: 20, target: [0.45, -0.5, 0] } });
</script>
</body>
</html>
