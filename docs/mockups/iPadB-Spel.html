        <button style="flex: 2; height: 64px; border-radius: 32px; border: 0; background: #39D0BE; color: #241634; font-family: Fredoka, sans-serif; font-size: 24px; font-weight: 600; box-shadow: 0 5px 0 #23998B">Klaar!</button>
