<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D-grepen iPad A</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="sax3d/ui.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<style>

body { padding: 28px 40px 28px; }
.app { height: 100%; display: grid; grid-template-rows: auto 1fr auto; gap: 22px; }
.top .seg:first-of-type { margin-left: auto; }
.strip-card .strip.staff { padding: 0 4px; }
main { display: grid; grid-template-columns: 42% 1fr; gap: 22px; min-height: 0; }
.sax-card { display: flex; flex-direction: column; overflow: hidden; }
.sax-card .stage { flex: 1; border-radius: 28px; }
.saxbar.tr { top: 14px; right: 14px; flex-direction: column; }
.note-card { padding: 30px 34px; display: flex; flex-direction: column; gap: 14px; }
.note-head { display: flex; align-items: center; justify-content: space-between; }
.note-main { flex: 1; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 20px; min-height: 0; }
.note-main .staff-svg { height: 230px; }
.big-name { font-size: 150px; }
.strip-card { padding: 10px; border-radius: 24px; }
.druk.big { font-size: 22px; }
.note-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.note-foot .sound { margin-left: auto; }

</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="back" aria-label="Terug"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h1>Grepentabel</h1>
    <div class="seg" role="group" aria-label="Welke noten"><button data-filter="mine">Mijn noten</button><button data-filter="all">Alle noten</button></div>
    <div class="seg" role="group" aria-label="Notenkiezer"><button data-strip-mode="buttons">Letters</button><button data-strip-mode="staff">Notenbalk</button><button data-strip-mode="both">Beide</button></div>
  </header>
  <main>
    <section class="card sax-card" aria-label="Greep op de sax">
      <div class="stage" data-stage>
      <div class="saxbar tr">
        <button class="icon" data-3d-only data-view-cycle aria-label="Andere kant"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 11-3-6.7"/><path d="M21 4v5h-5"/></svg></button>
        <button class="icon" data-3d-only data-zoom="in" aria-label="Inzoomen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
        <button class="icon" data-3d-only data-zoom="out" aria-label="Uitzoomen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
        <button class="icon" data-3d-only data-explode aria-pressed="false" aria-label="Uit elkaar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v6M9 6l3-3 3 3M12 21v-6M9 18l3 3 3-3"/><rect x="7" y="10.5" width="10" height="3" rx="1.5"/></svg></button>
        <button class="icon" data-showall aria-pressed="false" aria-label="Toon alle kleppen" title="Toon alle kleppen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="5.5" r="2.3"/><circle cx="9" cy="12" r="2.3"/><circle cx="9" cy="18.5" r="2.3"/><path d="M18 9v6M15 12h6"/></svg></button>
      </div>
        <div class="toast" data-info hidden></div>
        <div class="seg render" role="group" aria-label="Weergave"><button data-render="3d">3D</button><button data-render="2d">Eenvoudig</button></div>
        <div class="flat" data-flat hidden></div>
      </div>
    </section>
    <section class="card note-card" aria-label="Noot">
      <div class="note-head"><span class="badge" data-status></span><div class="playgroup" role="group" aria-label="Laat horen"><button class="pill" data-play><svg width="20" height="20" viewBox="0 0 22 22" aria-hidden="true"><path d="M3 8h4l5-4v14l-5-4H3z" fill="currentColor"/><path d="M15 7.5a5 5 0 010 7M17.5 5a8.5 8.5 0 010 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg> Laat horen</button><button class="pill auto" data-auto aria-pressed="false" title="Speel de noot bij elke wissel"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 014-4h12"/><path d="M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 01-4 4H4"/></svg><span>Bij elke noot</span></button></div></div>
      <div class="note-main">
        <div class="staff-svg" data-note-staff></div>
        <div><div class="big-name" data-note-name></div><div class="sub" data-note-sub></div></div>
      </div>
      <p class="druk big" data-druk></p>
      <div class="note-foot"><div class="alts" data-alts></div><div class="sound"><div class="seg" role="group" aria-label="Klank"><button data-sound="sax">Sax</button><button data-sound="toon">Toon</button></div></div></div>
    </section>
  </main>
  <nav class="card strip-card" aria-label="Kies een noot"><div class="strip-nav"><button class="step" data-step="-1" aria-label="Vorige noot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><div class="strip" data-notes></div><button class="step" data-step="1" aria-label="Volgende noot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button></div></nav>
</div>
<script type="module">
import { mountGrepen } from "./sax3d/ui.js";
mountGrepen({ sax: { dist: 13.5 } });
</script>
</body>
</html>
