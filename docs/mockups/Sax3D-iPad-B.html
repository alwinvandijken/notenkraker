<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D-grepen iPad B</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="sax3d/ui.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<style>

body { padding: 24px 32px; }
.app { height: 100%; display: grid; grid-template-columns: 1fr 380px; grid-template-rows: auto 1fr; gap: 20px; }
.top { grid-column: 1 / -1; }
.top .seg { margin-left: auto; }
.sax-card { overflow: hidden; display: flex; }
.sax-card .stage { flex: 1; border-radius: 28px; }
.saxbar.tl { top: 16px; left: 16px; }
.saxbar.bl { bottom: 16px; left: 16px; right: 16px; align-items: center; }
.saxbar.bl .druk { background: var(--surface); padding: 10px 16px; border-radius: 16px; box-shadow: 0 1px 3px rgba(23,36,64,.12); }
.saxbar.bl .dashed { margin-left: auto; background: var(--surface); }
.side { display: flex; flex-direction: column; gap: 20px; min-height: 0; }
.note-card { padding: 22px 24px; display: flex; flex-direction: column; gap: 12px; flex: 1; min-height: 0; }
.note-head { display: flex; align-items: center; justify-content: space-between; }
.note-main { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; flex: 1; min-height: 0; }
.note-main .staff-svg { height: 150px; }
.big-name { font-size: 104px; }
.strip-card { padding: 8px; border-radius: 24px; }

</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="back" aria-label="Terug"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h1>Grepentabel</h1>
    <div class="seg" role="group" aria-label="Welke noten"><button data-filter="mine">Mijn noten</button><button data-filter="all">Alle noten</button></div>
  </header>
  <section class="card sax-card" aria-label="Greep op de sax">
    <div class="stage" data-stage>
      <div class="saxbar tl">
        <button class="icon" data-view-cycle aria-label="Andere kant"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 11-3-6.7"/><path d="M21 4v5h-5"/></svg></button>
        <button class="icon" data-zoom="in" aria-label="Inzoomen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
        <button class="icon" data-zoom="out" aria-label="Uitzoomen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
        <button class="icon" data-explode aria-pressed="false" aria-label="Uit elkaar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v6M9 6l3-3 3 3M12 21v-6M9 18l3 3 3-3"/><rect x="7" y="10.5" width="10" height="3" rx="1.5"/></svg></button>
      </div>
      <div class="saxbar bl"><p class="druk" data-druk></p><button class="dashed" data-showall aria-pressed="false">Toon alle kleppen</button></div>
      <div class="toast" data-info hidden style="bottom:84px"></div>
    </div>
  </section>
  <div class="side">
    <section class="card note-card" aria-label="Noot">
      <div class="note-head"><span class="badge" data-status></span><button class="round" data-play aria-label="Laat horen"><svg width="20" height="20" viewBox="0 0 22 22" aria-hidden="true"><path d="M3 8h4l5-4v14l-5-4H3z" fill="currentColor"/><path d="M15 7.5a5 5 0 010 7M17.5 5a8.5 8.5 0 010 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg></button></div>
      <div class="note-main">
        <div class="staff-svg" data-note-staff="small"></div>
        <div><div class="big-name" data-note-name></div><div class="sub" data-note-sub></div></div>
      </div>
      <div class="alts" data-alts></div>
    </section>
    <nav class="card strip-card" aria-label="Kies een noot"><div class="strip staff" data-notes></div></nav>
  </div>
</div>
<script type="module">
import { mountGrepen } from "./sax3d/ui.js";
mountGrepen({ strip: "staff", sax: { dist: 12.5 } });
</script>
</body>
</html>
