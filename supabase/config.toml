project_id = "notenkraker"

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://notenkraker.netlify.app"]

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"

# opruimen van verlopen opnames (AC-118); de cron-taak stuurt de header x-cron-secret mee
[functions.purge-recordings]
verify_jwt = false
